<!DOCTYPE html>
<html lang="zh-CN">
    <!-- 不是我写的，是deepseek写的，我现在有点懒，回来再写吧 -->
<head>
    <meta charset="UTF-8">
    <title>Archive_01 // The Edge</title>
    <style>
        /* 基础重置：去掉浏览器默认的白边 */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 深灰偏黑 */
            color: #d4d4d4; /* 略带灰度的白字，不刺眼 */
            font-family: 'Courier New', Courier, monospace; /* 极客专属等宽字体 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* 占满整个屏幕高度 */
            padding: 20px;
            box-sizing: border-box;
        }

        /* 容器：限制最大宽度，让排版更紧凑 */
        .container {
            max-width: 800px;
            width: 100%;
        }

        /* 顶部的终端提示文本 */
        .terminal-header {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        /* 照片样式 */
        .photo-container {
            border: 1px solid #444; /* 细灰边框 */
            padding: 10px; /* 边框和内图之间的留白 */
            background-color: #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        img {
            width: 100%;
            display: block;
            filter: grayscale(20%) contrast(105%); /* 稍微降低一点饱和度，增加对比度，更有废墟感 */
        }

        /* 底部的档案信息 */
        .archive-info {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #999;
            text-align: left;
        }

        /* 高亮文字 */
        .highlight {
            color: #fff;
            font-weight: bold;
        }

        /* 闪动的光标效果 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #d4d4d4;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-header">
            > SYSTEM_BOOT_SEQUENCE_INITIATED...<br>
            > ACCESSING_ARCHIVE: TRUE<br>
            > STATUS: STABLE
        </div>

        <div class="photo-container">
            
            <img src="./IMG_20261105_151814.jpg" alt="The Edge">
        </div>

        <div class="archive-info">
            <p><span class="highlight">FILE_ID:</span> ARCHIVE_01</p>
            <p><span class="highlight">LOCATION:</span> Earth / [UNKNOWN_COORDINATES]</p>
            <p><span class="highlight">DESC:</span> "The Edge". A wall, a slope, and an ordinary sunny day. Captured by a real human before the Great Collapse.</p>
            <p>Awaiting further instructions<span class="cursor"></span></p>
        </div>
    </div>

</body>
</html>
